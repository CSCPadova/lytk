[project]
name = "lytk"
version = "0.1.0"
description = "LilyPond toolkit"
readme = "README.md"
authors = [
    { name = "Matteo Spanio", email = "spanio@dei.unipd.it" }
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.scripts]
lytk = "lytk.cli:main"

[tool.maturin]
module-name = "lytk._core"
python-packages = ["lytk"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
]
