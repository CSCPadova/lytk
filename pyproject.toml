[project]
name = "lytk"
version = "1.0.0"
description = "Fast music-notation conversion and augmentation: LilyPond, MusicXML/MXL, MIDI, and ABC through a shared IR, with ML representations."
readme = "README.md"
authors = [
    { name = "Matteo Spanio", email = "spanio@dei.unipd.it" }
]
requires-python = ">=3.10"
license = "GPL-2.0-only"
# The wheels embed the vendored tree-sitter grammar (MIT), whose notice must
# ship with any copy of it.
license-files = ["LICENSE", "src/tree-sitter/LICENSE"]
keywords = [
    "music",
    "notation",
    "lilypond",
    "musicxml",
    "midi",
    "abc",
    "music-information-retrieval",
    "symbolic-music",
    "conversion",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
# 1.23 is the DLPack floor: `__dlpack__` landed in 1.22 and
# `np.from_dlpack` in 1.23, and the representation arrays are
# documented as DLPack-consumable (torch/JAX/CuPy, zero-copy).
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# Deep-learning adapters in `lytk.datasets`: `to_pytorch_dataset` /
# `to_pytorch_dataloader` and the TensorFlow equivalents. Both frameworks are
# imported lazily, so neither is needed unless those methods are called.
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.12"]
# Generation-evaluation metrics (lytk.metrics): JS-similarity needs scipy;
# Fréchet Music Distance also needs torch + transformers + a LilyBERT checkpoint.
eval = ["scipy>=1.10", "torch>=2.0", "transformers>=4.30"]
# Everything optional, for `pip install lytk[all]`.
all = ["lytk[torch,tensorflow,eval]"]

[project.urls]
Homepage = "https://github.com/CSCPadova/lytk"
Repository = "https://github.com/CSCPadova/lytk"
Documentation = "https://github.com/CSCPadova/lytk/tree/master/docs"
Changelog = "https://github.com/CSCPadova/lytk/blob/master/docs/changelog.md"
Issues = "https://github.com/CSCPadova/lytk/issues"

[project.scripts]
lytk = "lytk.cli:main"

[tool.pytest.ini_options]
# Restrict collection to our suite — a bare `pytest` otherwise tries to collect
# the vendored reference projects (symusic/, lilybench/, …) and dies.
testpaths = ["tests"]

[tool.maturin]
module-name = "lytk._core"
python-packages = ["lytk"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
]
