name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  lilypond-oracle:
    # LilyPond compiles lytk's LilyPond output to MIDI; that must match lytk's
    # own MIDI of the same score (tests/lilypond_oracle.rs).
    name: LilyPond oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lilypond
      - run: cargo test --test lilypond_oracle -- --ignored --nocapture

  lilypond-corpus:
    # The grammar against LilyPond's own regression tests and snippets:
    # valid files the parser flags with syntax errors (tests/ly_corpus.rs).
    name: LilyPond corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch LilyPond v2.26.0 (regression tests and snippets only)
        run: |
          git clone --depth 1 --branch v2.26.0 --filter=blob:none --sparse \
            https://gitlab.com/lilypond/lilypond.git "$RUNNER_TEMP/lilypond"
          git -C "$RUNNER_TEMP/lilypond" sparse-checkout set input/regression Documentation/snippets
      - run: cargo test --test ly_corpus -- --ignored --nocapture
        env:
          LYTK_LILYPOND_SRC: ${{ runner.temp }}/lilypond
      # The LilyPond-shaped fuzz properties, with many more cases than in
      # `cargo test` (release build: inputs at the reader's bounds are slow
      # unoptimised).
      - run: cargo test --release --test fuzz_inputs lilypond_shaped
        env:
          LYTK_FUZZ_CASES: "1024"

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "v=$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create and expose virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      # Upgrade pip so maturin can install PEP 735 dependency-groups (pip install --group).
      - run: python -m pip install --upgrade pip
      - run: pip install maturin pytest pytest-benchmark scipy
      # CPU-only torch so the torch dataset-adapter tests run instead of skipping
      # (scipy above enables the eval-metric tests too).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # TensorFlow too: its dtype rules are stricter than torch's, so the tf
      # data-loader path fails on inputs the torch path accepts. Without this
      # every tf test silently skips and that class of bug ships.
      - run: pip install tensorflow-cpu
      - run: maturin develop
      - run: pytest tests/ -v
