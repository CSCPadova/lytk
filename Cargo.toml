[package]
name = "lytk"
version = "0.1.0"
edition = "2021"
# Floor set by our oldest dependency (clap 4.6). Matters because the PyPI sdist
# is compiled on the user's own toolchain.
rust-version = "1.85"
build = "src/tree-sitter/bindings/rust/build.rs"
description = "Fast music-notation conversion and augmentation: LilyPond, MusicXML/MXL, MIDI, and ABC through a shared IR, with ML representations."
authors = ["Matteo Spanio <spanio@dei.unipd.it>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/CSCPadova/lytk"
repository = "https://github.com/CSCPadova/lytk"
documentation = "https://github.com/CSCPadova/lytk/tree/master/docs"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lytk"
path = "src/main.rs"

[features]
default = []

# Keep integer-overflow checks on in release/wheel builds as defense-in-depth:
# a missed overflow on attacker-controlled durations/ticks then panics (caught at
# the FFI boundary) rather than silently wrapping into corrupt output. The hot
# paths already use checked/saturating arithmetic; the perf cost is negligible
# for this workload.
[profile.release]
overflow-checks = true

[build-dependencies]
cc = "1"

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py310" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.10
# (matches `requires-python = ">=3.10"` in pyproject.toml).
pyo3 = { version = "0.22.4", features = ["extension-module", "abi3-py310"] }
tree-sitter = "0.24"
tree-sitter-language = "0.1"
num = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
thiserror = "2"
anyhow = "1"
midly = "0.5"
musicxml = "1.1.2"
numpy = "0.22"
# Bounded MXL (ZIP) decompression: we unzip `.mxl` ourselves with a size cap and
# hand plain XML to the `musicxml` crate, bypassing its unbounded, panic-prone
# ZIP reader (decompression-bomb + out-of-bounds-read hardening). deflate only.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bench]]
name = "benchmarks"
harness = false
